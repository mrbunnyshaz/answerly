<title>Answerly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centred column on faint graph paper. Red-pen marks on blue-ink working. */
:root {
  --bg: #f2f5f9; --surface: #ffffff; --surface2: #e9eef5; --ink: #101a33; --muted: #566079;
  --line: #d3dbe8; --blue: #2244c4; --blue-soft: #e3e9fb; --red: #c9232f; --red-soft: #fbe4e5;
  --green: #16794f; --green-soft: #ddf3e8; --amber: #8a5a00; --amber-soft: #fbefd0; --grid: rgba(34,68,196,.07);
  --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1224; --surface: #141c33; --surface2: #1b2544; --ink: #e8edf9; --muted: #9aa6c4;
    --line: #2a3558; --blue: #8ea8ff; --blue-soft: #1d2a5c; --red: #ff7b84; --red-soft: #3a1a22;
    --green: #5fd6a0; --green-soft: #12382b; --amber: #f0c060; --amber-soft: #3a2d10; --grid: rgba(142,168,255,.07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1224; --surface: #141c33; --surface2: #1b2544; --ink: #e8edf9; --muted: #9aa6c4;
  --line: #2a3558; --blue: #8ea8ff; --blue-soft: #1d2a5c; --red: #ff7b84; --red-soft: #3a1a22;
  --green: #5fd6a0; --green-soft: #12382b; --amber: #f0c060; --amber-soft: #3a2d10; --grid: rgba(142,168,255,.07);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.wrap, .wrap > *, .sec, .stepbox { min-width: 0; }
.wrap .wrap { margin: 0; width: 100%; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.eyebrow { font: 500 .72rem var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 700 1.7rem var(--f-display); letter-spacing: -.02em; display: flex; align-items: baseline; gap: 10px; }
.brand b { color: var(--red); font-weight: 700; }
.brand small { font: 400 .8rem var(--f-body); color: var(--muted); letter-spacing: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface2); padding: 4px; border-radius: 10px; max-width: 100%; }
.tab { border: 0; background: transparent; color: var(--muted); font: 600 .85rem var(--f-body); padding: 7px 14px; border-radius: 7px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 200px; min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 5px; font-weight: 600; font-size: .85rem; }
select, input[type="text"] { font: 400 .95rem var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; width: 100%; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.btn { font: 600 .9rem var(--f-body); border-radius: 8px; padding: 10px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0c1224; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0c1224; } }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* consent */
.consent li { list-style: none; }
.consent ul { padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; }
.check input { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--blue); flex: none; }

/* upload */
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.drop.over { border-color: var(--blue); background: var(--blue-soft); }
.drop img { max-height: 260px; border-radius: 6px; border: 1px solid var(--line); }
.note { font-size: .82rem; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.pill { font: 500 .7rem var(--f-mono); padding: 3px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.pill.ex { background: var(--amber-soft); color: var(--amber); }

/* status */
.status { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 10px; background: var(--blue-soft); color: var(--ink); }
.status.err { background: var(--red-soft); }
.spin { width: 16px; height: 16px; border: 2px solid var(--blue); border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* result */
.q-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.q-num { font: 500 .78rem var(--f-mono); background: var(--ink); color: var(--bg); padding: 3px 9px; border-radius: 5px; }
.score { font: 500 .9rem var(--f-mono); }
.qtext { font-size: 1.02rem; font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec > .eyebrow { display: flex; align-items: center; gap: 8px; }
.wrong { border-left: 4px solid var(--red); background: var(--red-soft); border-radius: 0 8px 8px 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.right { border-left: 4px solid var(--green); background: var(--green-soft); border-radius: 0 8px 8px 0; padding: 12px 14px; }
.cause { font: 600 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 5px; background: var(--red); color: #fff; align-self: flex-start; }
:root[data-theme="dark"] .cause { color: #1a0a0d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cause { color: #1a0a0d; } }
.cause.ok { background: var(--green); }
.cause.unk { background: var(--muted); }
.stepbox { border: 1px solid var(--line); border-bottom: 0; border-radius: 8px; overflow-x: auto; }
.steps { display: grid; grid-template-columns: minmax(180px, 1.3fr) 64px minmax(180px, 1.7fr); min-width: 520px; }
.steps > div { padding: 9px 12px; border-bottom: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.steps > .h { font: 500 .68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface2); }
.steps > .w { font: 400 .9rem var(--f-mono); color: var(--blue); white-space: pre-wrap; }
.steps > .m { font: 500 .78rem var(--f-mono); }
.steps > .y { font-size: .88rem; }
.mk { display: inline-block; background: var(--green-soft); color: var(--green); padding: 2px 7px; border-radius: 4px; }
.final { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-weight: 600; }
.final .mono { font-size: 1.05rem; background: var(--green-soft); color: var(--green); padding: 4px 10px; border-radius: 6px; }
.mtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.mtab { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .82rem var(--f-body); padding: 7px 12px; border-radius: 99px; cursor: pointer; }
.mtab[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
:root[data-theme="dark"] .mtab[aria-selected="true"] { color: #0c1224; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mtab[aria-selected="true"] { color: #0c1224; } }
.badge { font: 500 .72rem var(--f-mono); padding: 3px 9px; border-radius: 99px; }
.badge.high { background: var(--green-soft); color: var(--green); }
.badge.medium, .badge.low { background: var(--amber-soft); color: var(--amber); }
.review { background: var(--amber-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: .88rem; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* audit */
.log { display: flex; flex-direction: column; gap: 8px; }
.entry { display: grid; grid-template-columns: 150px 1fr auto; gap: 4px 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .85rem; min-width: 0; }
.entry > * { min-width: 0; overflow-wrap: anywhere; }
.entry .t { font: 400 .75rem var(--f-mono); color: var(--muted); }
.entry .hash { font: 400 .72rem var(--f-mono); color: var(--muted); }
.entry .meta { grid-column: 2 / -1; font: 400 .74rem var(--f-mono); color: var(--muted); }
.out { font: 500 .72rem var(--f-mono); padding: 2px 8px; border-radius: 4px; background: var(--surface2); align-self: start; }
.out.approved, .out.ok { background: var(--green-soft); color: var(--green); }
.out.declined { background: var(--red-soft); color: var(--red); }
@media (max-width: 560px) { .entry { grid-template-columns: 1fr; } .entry .meta { grid-column: 1; } }

/* approval gate */
.scrim { position: fixed; inset: 0; background: rgba(8,12,24,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.dialog pre { margin: 0; font: 400 .78rem var(--f-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 190px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.foot { font-size: .78rem; color: var(--muted); text-align: center; padding-top: 6px; }

/* two-pass check, reveal, explain */
.banner { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 12px 14px; font-size: .9rem; }
.banner.warn { background: var(--amber-soft); }
.banner.bad { background: var(--red-soft); border-left: 4px solid var(--red); }
.banner.good { background: var(--green-soft); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 6px; }
.cmp .mono { font-size: .88rem; }
@media (max-width: 560px) { .cmp { grid-template-columns: 1fr; } }
.reveal { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 14px; border: 1px dashed var(--line); border-radius: 8px; background: var(--bg); }
.linkbtn { background: none; border: 0; color: var(--blue); font: 600 .78rem var(--f-body); cursor: pointer; padding: 4px 0; text-align: left; }
.steps > .exp { grid-column: 1 / -1; background: var(--blue-soft); font-size: .88rem; white-space: pre-wrap; }
textarea { font: 400 .95rem var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; width: 100%; min-height: 70px; resize: vertical; }

/* reviews and teacher queue */
.rv { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); min-width: 0; }
.st { font: 500 .7rem var(--f-mono); padding: 3px 9px; border-radius: 99px; background: var(--amber-soft); color: var(--amber); white-space: nowrap; }
.st.approved { background: var(--green-soft); color: var(--green); }
.st.corrected { background: var(--blue-soft); color: var(--blue); }
.st.rejected { background: var(--red-soft); color: var(--red); }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: .88rem; }
.kv > * { min-width: 0; overflow-wrap: anywhere; }
.kv dt { color: var(--muted); font-weight: 600; } .kv dd { margin: 0; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; } }
.teacher-note { border-left: 4px solid var(--blue); background: var(--blue-soft); border-radius: 0 8px 8px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }

/* safety tab */
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; min-width: 480px; }
.tbl th, .tbl td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 500 .68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface2); }
.tbl tr:last-child td { border-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 .74rem var(--f-mono); padding: 4px 10px; border-radius: 99px; }
.chip.built { background: var(--green-soft); color: var(--green); }
.chip.planned { background: var(--surface2); color: var(--muted); }
.demo { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
</style>
